mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "UrbanSoundClassification"

csv_file: "data/raw/UrbanSound8K.csv"
data_dir: "data/signals"
input_data_dir: "data/raw"
train_data_dir: "data/signals/train"
val_data_dir: "data/signals/val"
test_data_dir: "data/signals/test"

n_mfcc: 50
test_size: 0.2
val_size: 0.2
seed: 42

batch_size: 128
num_workers: 4
pin_memory: True

hidden_size: 16
num_epochs: 5
lr: 0.001

checkpoint_save_path: "checkpoints"
checkpoint: #"checkpoints/best.pth.tar"

model_name: "UrbanEchoModel"